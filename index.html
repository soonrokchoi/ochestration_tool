<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCHE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="bar">
        <div id="switcher"></div>
        <button id="open-settings" type="button" class="ghost" aria-label="설정">설정</button>
      </div>
      <div class="bar">
        <button id="refresh" type="button">새로고침</button>
        <span id="updated" class="muted"></span>
        <button id="flush" type="button" class="primary" disabled>지금 반영 (0)</button>
      </div>
    </header>

    <main id="main"></main>

    <dialog id="settings">
      <form id="settings-form" method="dialog">
        <h2>설정</h2>
        <label>
          프로젝트 (한 줄에 하나)
          <textarea id="set-projects" rows="4" spellcheck="false" placeholder="Halcyon | soonrokchoi/space-sandbox1 | docs/agents/locks"></textarea>
        </label>
        <p class="muted small">
          형식: <code>이름 | owner/repo | 잠금 폴더</code>. 이름과 잠금 폴더는 빼도 됩니다. 잠금 폴더를 적으면 그 안의 잠금 파일 수를 도는 AI 수에 더합니다.
        </p>
        <label>
          GitHub fine-grained 토큰
          <input id="set-token" type="password" autocomplete="off" />
        </label>
        <p class="muted small">
          위 저장소들에만 Issues·Contents·Pull requests 읽기·쓰기, Actions 읽기 권한을 준 토큰을 쓰세요. 토큰은 이 브라우저에만 저장됩니다.
        </p>
        <div class="row">
          <button value="cancel" formnovalidate type="button" onclick="this.closest('dialog').close()">취소</button>
          <button value="save" class="primary">저장</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status" hidden></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
